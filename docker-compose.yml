# Usage:
#   1. Create a .env file next to this one containing:  SESSION_SECRET=<64 random hex characters>
#   2. docker compose up --build
#   3. Open http://localhost:3000   (demo@cardiolens.test / Demo123!  or  admin@cardiolens.test / Admin123!)
services:
  app:
    build: .
    image: cardiolens:latest
    ports:
      - "3000:3000"
    environment:
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET in .env (see docker-compose.yml)}
      DB_PATH: /app/db/cardiolens.db
    volumes:
      - cardiolens-db:/app/db          # database survives rebuilds and restarts
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/login').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  cardiolens-db:
